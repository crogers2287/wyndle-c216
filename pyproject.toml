[project]
name = "wyndle-c216"
version = "0.1.0"
description = "Local-first AI companion runtime for one TP-Link Tapo C216"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "onnxruntime==1.27.0",
  "onvif-zeep>=0.2.12,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "PyYAML>=6,<7",
  "sentencepiece>=0.2,<1",
  "sherpa-onnx>=1.12.0,<2",
  "structlog>=24.1,<26",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.6,<1"]

[project.scripts]
wyndle = "wyndle.main:main"
wyndle-probe = "wyndle.probe:main"
wyndle-demo = "wyndle.demo:main"
wyndle-debug = "wyndle.debug_dashboard:main"
wyndle-live = "wyndle.live:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wyndle"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
